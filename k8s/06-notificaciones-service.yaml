# Microservicio de notificaciones (imagen construida localmente y cargada
# al clúster kind con `kind load docker-image`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones-service
  namespace: comercios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificaciones-service
  template:
    metadata:
      labels:
        app: notificaciones-service
    spec:
      # Espera a que Postgres acepte conexiones antes de arrancar la app.
      initContainers:
        - name: espera-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando a postgres...; sleep 3; done"]
      containers:
        - name: app
          image: notificaciones-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: db-port
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: rabbitmq-host
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: rabbitmq-port
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: rabbitmq-password
            # La URL se arma con las variables ya declaradas arriba.
            - name: JDBC_DATABASE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/notificaciones"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: db-password
          readinessProbe:
            httpGet:
              path: /salud
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 320Mi
            limits:
              cpu: 400m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones-service
  namespace: comercios
spec:
  type: ClusterIP
  selector:
    app: notificaciones-service
  ports:
    - port: 8081
      targetPort: 8081
