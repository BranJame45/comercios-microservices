  db-password: "comercios"
  rabbitmq-user: "comercios"
  rabbitmq-password: "comercios"
  jwt-secret: "clave-demo-para-el-cluster-local-de-kind-cambiar-en-produccion"
  admin-username: "admin"
  admin-password: "Admin2026!"
