# Microservicio de afiliación de comercios (imagen construida localmente
# y cargada al clúster kind con `kind load docker-image`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comercios-service
  namespace: comercios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comercios-service
  template:
    metadata:
      labels:
        app: comercios-service
    spec:
      # Espera a que Postgres acepte conexiones antes de arrancar la app.
      initContainers:
        - name: espera-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo esperando a postgres...; sleep 3; done"]
      containers:
        - name: app
          image: comercios-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: db-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: db-port
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: postgres-db
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: rabbitmq-host
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: comercios-config
                  key: rabbitmq-port
            # La URL se arma con las variables ya declaradas arriba.
            - name: JDBC_DATABASE_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: db-password
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: rabbitmq-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: jwt-secret
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comercios-secret
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comercios-service
  namespace: comercios
spec:
  type: ClusterIP
  selector:
    app: comercios-service
  ports:
    - port: 8080
      targetPort: 8080
---
# Autoescalado horizontal: crece cuando el CPU promedio supera 70%.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: comercios-service
  namespace: comercios
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: comercios-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
