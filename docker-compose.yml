services:
  postgres:
    image: postgres:16-alpine
    container_name: comercios-postgres
    environment:
      POSTGRES_USER: comercios
      POSTGRES_PASSWORD: comercios
      POSTGRES_DB: comercios
    # El host usa 5434 para no chocar con los PostgreSQL instalados en la
    # propia máquina (conflicto típico en Windows).
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-bd.sql:/docker-entrypoint-initdb.d/init-bd.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercios -d comercios"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: comercios-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: comercios
      RABBITMQ_DEFAULT_PASS: comercios
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  rabbitmq_data:
