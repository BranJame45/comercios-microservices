name: Calidad de código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analisis:
    name: Análisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar comercios-service (Maven)
        working-directory: comercios-service
        run: mvn -B -DskipTests package

      - name: Compilar notificaciones-service (Gradle)
        working-directory: notificaciones-service
        run: bash ./gradlew build -x test

      - name: Análisis con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
